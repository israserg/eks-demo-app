name: Build image and Helm chart

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "chart/**"
      - ".github/workflows/build-push.yml"

env:
  AWS_REGION: eu-north-1
  # Private ECR repos created by Terraform in eks-arc (ecr.tf).
  IMAGE_REPOSITORY: eks-arc-demo
  CHART_REGISTRY_PATH: charts # chart "demo" is pushed to <registry>/charts/demo

jobs:
  build-test-push:
    # Runner scale set for this repo (Terraform: arc-app.tf).
    runs-on: arc-app
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set versions
        run: |
          # Chart version is plain semver; the image tag adds the commit for traceability.
          echo "CHART_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE_REPOSITORY:$IMAGE_VERSION" app/

      - name: Run and test the container
        run: |
          docker run -d --name test-app -p 8080:80 "$IMAGE_REPOSITORY:$IMAGE_VERSION"
          for i in $(seq 1 10); do
            if curl -fs http://localhost:8080 | grep -q "ARC runner test"; then
              echo "Test passed: page served on port 8080"
              docker rm -f test-app
              exit 0
            fi
            sleep 2
          done
          echo "Test failed: page not served"
          docker logs test-app
          docker rm -f test-app
          exit 1

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        # Uses the runner pod's Pod Identity role. Writes credentials to the Docker config,
        # which Helm also reads for "helm push".

      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$IMAGE_REPOSITORY"
          docker tag "$IMAGE_REPOSITORY:$IMAGE_VERSION" "$IMAGE:$IMAGE_VERSION"
          docker push "$IMAGE:$IMAGE_VERSION"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      # The chart is built after the image, because it points at that image.
      - name: Lint, package and push Helm chart
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          helm lint chart/
          helm package chart/ --version "$CHART_VERSION" --app-version "$IMAGE_VERSION"
          # Show what will actually be deployed, to make the version link visible in the log.
          helm template demo "demo-${CHART_VERSION}.tgz" | grep "image:"
          helm push "demo-${CHART_VERSION}.tgz" "oci://$REGISTRY/$CHART_REGISTRY_PATH"
          echo "Pushed chart $REGISTRY/$CHART_REGISTRY_PATH/demo:$CHART_VERSION (image $IMAGE_VERSION)"

      # Shown on the workflow run page. Runs only if every step above succeeded,
      # so it never lists a version that was not actually pushed.
      - name: Summary of created versions
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          {
            echo "## Published versions"
            echo
            echo "| Artifact | Version | Location |"
            echo "|---|---|---|"
            echo "| Docker image | \`$IMAGE_VERSION\` | \`$REGISTRY/$IMAGE_REPOSITORY:$IMAGE_VERSION\` |"
            echo "| Helm chart | \`$CHART_VERSION\` (appVersion \`$IMAGE_VERSION\`) | \`oci://$REGISTRY/$CHART_REGISTRY_PATH/demo:$CHART_VERSION\` |"
            echo
            echo "Commit: \`${GITHUB_SHA::7}\`, run #$GITHUB_RUN_NUMBER"
            echo
            echo "**To deploy:** in the eks-gitops repo set \`image.tag: $IMAGE_VERSION\` in \`root/demo.yaml\`"
            echo "(and copy \`chart/\` into \`apps/demo/chart/\` if the chart changed)."
          } >> "$GITHUB_STEP_SUMMARY"
